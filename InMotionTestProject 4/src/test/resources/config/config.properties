# ============================================================
# InMotion Hosting - Test Automation Configuration
# ============================================================

# Base URL
base.url=https://www.inmotionhosting.com

# Browser (chrome / firefox)
browser=chrome

# Implicit Wait (seconds)
implicit.wait=10

# Explicit Wait (seconds)
explicit.wait=10

# Page Load Timeout (seconds)
page.load.timeout=60

# Headless Mode (true / false)
headless=false

# Screenshot on Failure (true / false)
screenshot.on.failure=true

# ============================================================
# API Testing Config (JSONPlaceholder used as public REST API)
# For real InMotion, replace with actual API base URI
# ============================================================
api.base.uri=https://jsonplaceholder.typicode.com
api.users.endpoint=/users
api.posts.endpoint=/posts
api.comments.endpoint=/comments
